# Local / single-host deployment: web + worker sharing one SQLite file on a volume.
#   cp .env.example .env   # fill in values (or set CIVICBOT_DEV_MODE=1 to click through with a fake X)
#   docker compose up --build
# For Postgres: `docker compose --profile postgres up` and set
#   DATABASE_URL=postgresql+psycopg://civicbot:civicbot@db:5432/civicbot in .env
services:
  web:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["civicbot-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "civicbot.web.worker"]
    volumes: ["civicbot-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "civicbot.web.worker", "--check"]
      interval: 60s
      timeout: 10s
      start_period: 30s
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: civicbot
      POSTGRES_PASSWORD: civicbot   # local only; use your host's managed Postgres in production
      POSTGRES_DB: civicbot
    volumes: ["pg-data:/var/lib/postgresql/data"]
volumes:
  civicbot-data:
  pg-data:
