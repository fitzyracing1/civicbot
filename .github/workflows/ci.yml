name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test (mocked HTTP only; live tests excluded)
        env:
          CIVICBOT_LIVE: "0"
        run: pytest -q -m "not live"
      - name: Site builds (GitHub Pages) and JS parses
        run: |
          python scripts/build_site.py _site
          for f in site/assets/*.js; do node --check "$f"; done
          python -c "import json;d=json.load(open('_site/data/free_apis.json'));assert d['count']>=50;print(d['count'],'APIs')"
          python -c "import json;d=json.load(open('_site/data/grok-pack.json'));assert len(d['skills'])>=30;print(len(d['skills']),'Grok pack skills')"
          test -s _site/grok.txt && test -s _site/llms.txt && test -s _site/grok.html
