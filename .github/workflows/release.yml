# Publishes civicbot to PyPI with Trusted Publishing (OIDC; no API token stored anywhere)
# when a GitHub release is published, or by hand with "Run workflow".
#
# One-time setup on pypi.org (account owner): Account settings -> Publishing -> "Add a new pending publisher"
#   PyPI project name: civicbot   Owner: fitzyracing1   Repository name: civicbot
#   Workflow name: release.yml    Environment name: pypi
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test (mocked only)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q -m "not live"
      - name: Build and check
        run: |
          python -m pip install --quiet build twine trove-classifiers
          python -m build
          python -m twine check --strict dist/*
          python - <<'PY'
          import tomllib, trove_classifiers
          cls = tomllib.load(open("pyproject.toml", "rb"))["project"]["classifiers"]
          bad = [c for c in cls if c not in trove_classifiers.classifiers]
          assert not bad, f"invalid classifiers: {bad}"
          PY
      - name: Version matches tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/civicbot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
